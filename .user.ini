; Subnext Production PHP Configuration for GO54 / cPanel (PHP-FPM & FastCGI)
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off
session.cookie_httponly = 1
; session.cookie_secure enforces HTTPS-only cookies in production
session.cookie_secure = 1
session.use_only_cookies = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
